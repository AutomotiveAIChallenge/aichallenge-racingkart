# NVIDIA GPU overlay. Must be combined with docker-compose.yml (and
# docker-compose.eval.yml when using autoware-simulator-evaluation):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.eval.yml:docker-compose.gpu.yml
# Standalone use will fail — services have no image or build context here.
x-gpu: &gpu
  # Ensure the NVIDIA runtime exposes devices+capabilities even when the
  # host environment variables are unset.
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: ["gpu"]

services:
  autoware:
    <<: *gpu

  autoware-command:
    <<: *gpu

  autoware-simulator-evaluation:
    <<: *gpu

  simulator:
    <<: *gpu
