repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
        # --unsafe: syntax-only check so Compose Spec tags (!override in
        # docker-compose.wsl.yml) parse without a "could not determine a
        # constructor" failure, while still catching real YAML syntax errors.
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.2
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.6.0-2
    hooks:
      - id: shfmt
        args: [-w, -s, -i=4]
