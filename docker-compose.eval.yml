# Local evaluation service.
# AWS Batch runs the eval image directly (job definition in aichallenge-aws);
# this file is local-only convenience. Always list it in COMPOSE_FILE right
# after docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.eval.yml[:docker-compose.gpu.yml][:docker-compose.sound.yml]
#
# NOTE: this service runs as the host UID/GID (like the dev services in
# docker-compose.yml) so that host-mounted artifacts under ./output are written
# host-owned directly — no root chown needed. The eval image bakes /aichallenge
# in (built/owned by root, chmod 757); the host-UID process only reads/executes
# it, and writes only under /output. HOME=/tmp covers the passwd-less UID.
# AWS Batch no longer runs this via compose, so local eval is free to drop root.
# fix_ownership.bash stays in run_evaluation.bash as a no-op safety net (it
# self-skips when not root).
services:
  autoware-simulator-evaluation:
    image: "aichallenge-2025-eval"
    privileged: true
    pull_policy: never
    network_mode: host
    stop_grace_period: 10s
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${HOST_GID_RENDER:-110}"
      - "${HOST_GID_VIDEO:-44}"
      - "${HOST_GID_INPUT:-107}"
    environment:
      - HOME=/tmp
      - DISPLAY=${DISPLAY}
      - USER=${USER}
      - ROS_DISTRO=humble
      - XAUTHORITY=${XAUTHORITY:-}
      - QT_X11_NO_MITSHM=1
      - TZ=Asia/Tokyo
      - SIM_MODE=${SIM_MODE:-}
      - COLCON_TRACE=${COLCON_TRACE:-}
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    volumes:
      - ./output:${OUTPUT_ROOT:-/output}
      # /aichallenge is baked into the eval image; intentionally not mounted here
      - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
    devices:
      - /dev/dri
    working_dir: /aichallenge
    command: ["bash", "-lc", "exec /aichallenge/run_evaluation.bash"]
