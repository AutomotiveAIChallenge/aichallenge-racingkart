data:
  # データセットのディレクトリパス
  train_dir: "/aichallenge/ml_workspace/tiny_lidar_net/dataset/train"
  val_dir: "/aichallenge/ml_workspace/tiny_lidar_net/dataset/val"

# 学習と推論で共通のパラメータ（model.input_dim, max_range, accel_scale, brake_scale）のファイル。
# 推論ノードと同じファイルを読むので、値はこのファイルだけで変える。Docker コンテナ内の固定パス
common_param_path: "/aichallenge/workspace/src/aichallenge_submit/tiny_lidar_net_controller/config/tiny_lidar_net_common.param.yaml"

model:
  # "TinyLidarNet" または "TinyLidarNetSmall"
  name: "TinyLidarNet"
  # LiDARのスキャン点数（input_dim）は common_param_path のファイルで設定する
  # 出力次元（[accel, steer]）
  output_dim: 2

train:
  batch_size: 64
  num_workers: 4
  epochs: 100
  lr: 0.001
  
  early_stop_patience: 15

  # 事前学習済みモデルのパス（指定しない場合は null）
  pretrained_path: null

  # 保存先設定
  save_dir: "/aichallenge/ml_workspace/tiny_lidar_net/checkpoints"
  log_dir: "/aichallenge/ml_workspace/tiny_lidar_net/logs"

  # 損失関数の重み設定
  loss:
    steer_weight: 1.0
    accel_weight: 1.0
