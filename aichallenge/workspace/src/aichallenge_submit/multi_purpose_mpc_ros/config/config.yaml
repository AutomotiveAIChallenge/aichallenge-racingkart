common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  # 中心線(参照パス)の取得元を切り替える。
  #   true : /planning/scenario_planning/trajectory トピックから取得。
  #          このとき下記 csv_path は使われない(CSVは読み込まれない)。速度は use_ref_vel_config に従う。
  #          circular は trajectory の形状に合わせる(閉ループ→true / 開経路・前方ウィンドウ→false)。
  #   false: csv_path の CSV から取得(csv_path が空なら waypoints.csv_path)。
  update_by_topic: true
  # ref_vel.yaml(区間ごとの目標速度)を読み込むか。update_by_topic とは独立。
  # true の場合: ref_vel.yaml を読み込み、wp_id 区間ごとの目標速度で速度参照を上書きする
  #             (update_v_max + set_v_ref)。--ref_vel_path 未指定なら無効。
  #             ※ update_by_topic: true との併用は、ref_vel が CSV(traj_mincurv)の
  #               wp_id 基準のため topic 経路と形状が合わず、実質 update_v_max(全体上限)
  #               のみ効く。topic 経路で区間速度を使いたい場合は別途対応が必要。
  # false の場合: topicモードなら topic の longitudinal_velocity_mps、
  #               CSVモードなら compute_speed_profile(曲率ベース)を速度参照に使う。
  use_ref_vel_config: false
  # 参照パスCSV(pkg share 基準)。次のいずれかで読み込まれる:
  #   - update_by_topic: false(CSVモードの中心線)
  #   - use_ref_vel_config: true(ref_vel 用参照パス。update_by_topic:true でも読まれる)
  # topic + use_ref_vel_config:false のときのみ読み込まれない。
  # "" にすると waypoints.csv_path(列: wp_x,wp_y)にフォールバックする。
  csv_path: "env/final_ver3/traj_mincurv.csv"
  resolution: 0.6
  smoothing_distance: 2
  max_width: 6.0
  # 経路が閉ループか。閉ループ→true(連続周回可)/ 開経路→false(終端で停止)。
  circular: true
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  width: 2.30   # +safety margin

mpc:
  N: 20
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  R: [100000.0, 0.0]
  a_min: -1.6 # m/s^2
  a_max: 0.7 # m/s^2
  delta_max_deg: 32.0 # degrees
  steer_rate_max: 0.35 # rad/s
  control_rate: 40.0 # Hz
  steering_tire_angle_gain_var: 1.639
  # steering_tire_angle_gain_var: 1.0
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  accel_low_pass_gain: 1.0
  steer_low_pass_gain: 1.0
  wp_id_offset: 2
  use_max_kappa_pred: true


  ## ---------- 究極 ------------- ##
  ## Lap1: 53s, Lap2: 47s

  # v_max: 30.0   # km/h
  # ay_max: 12.0  # m/s^2, maximum lateral acceleration in curves
  # Q: [600000.0, 100000000.0, 2000000.0]
  # QN: [1000000.0, 1000000.0, 10000.0]

  ## --- 高速 (gnss delay 0.3) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 高速 (gnss delay 0.4) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 1850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 中高速 --- ##
  ## Lap1: 59s, Lap2: 54s
  # v_max: 25.0
  # ay_max: 7.0
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --------- 中速 -------------- ##
  ## Lap1: 67s, Lap2: 64s

  v_max: 20.0
  ay_max: 6.5
  Q: [3000000.0, 90000000.0, 100000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  QN: [1000000.0, 1000.0, 10000.0]

  ## -------- 低速 -------------- ##
  ## Lap1: 86s

  # v_max: 15.0
  # ay_max: 5.5
  # Q: [5000000.0, 100000000.0, 200000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

v2x_obstacle_avoidance:
  vehicle_radius: 0.5          # [m]
  v_max_safety: 30.0           # [m/s]
  position_jump_threshold: 5.0 # [m]
