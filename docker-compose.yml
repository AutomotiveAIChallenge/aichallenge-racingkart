x-autoware-base: &autoware-base
  image: "aichallenge-2025-dev"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    - HOME=/tmp
    - DISPLAY=${DISPLAY:-}
    - USER=${USER}
    - ROS_DISTRO=humble
    - XAUTHORITY=${XAUTHORITY:-}
    - QT_X11_NO_MITSHM=1
    - TZ=Asia/Tokyo
    - RUN_MODE=${RUN_MODE:-}
    - SIM_MODE=${SIM_MODE:-}
    - CMD=${CMD:-}
    - COLCON_TRACE=${COLCON_TRACE:-}
    - ROS_HOME=${ROS_HOME:-}
    - ROS_LOG_DIR=${ROS_LOG_DIR:-}
    - HOST_UID=${HOST_UID:-}
    - HOST_GID=${HOST_GID:-}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - LOG_DIR=${LOG_DIR:-}
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./aichallenge:/aichallenge
    - ./remote:/remote
    - ./vehicle:/vehicle
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri
    - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  devices:
    - /dev/dri
    - /dev/video0
    - /dev/input
  group_add:
    # Read /dev/input/event* (joy_node/SDL2) as non-root user. GID from host `input` group.
    - "${HOST_GID_INPUT:-104}"
  working_dir: /aichallenge

x-autoware-rosbag-base: &autoware-rosbag-base
  <<: *autoware-base
  stop_grace_period: 60s
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./aichallenge:/aichallenge
    - ./remote:/remote
    - ./vehicle:/vehicle
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - ${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}:/workspace:ro
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # No audio mount: rosbag recording needs no PulseAudio.
    - /dev/dri:/dev/dri
    - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw

x-racing_kart_interface-base: &racing_kart_interface-base
  image: "ghcr.io/tier4/racing_kart_interface:latest-experiment"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    - HOME=/tmp
    - DISPLAY=${DISPLAY:-}
    - USER=${USER}
    - TZ=Asia/Tokyo
    - ROS_DISTRO=humble
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - LOG_DIR=${LOG_DIR:-}
    - HOST_UID=${HOST_UID:-}
    - HOST_GID=${HOST_GID:-}
    - NTRIP_USERNAME=${NTRIP_USERNAME:-}
    - NTRIP_PASSWORD=${NTRIP_PASSWORD:-}
    # V2X position sharing. Passed through to racing_kart_vehicle.launch.xml.
    # Defaults keep the driver launchable when V2X is not configured: the broker
    # falls back to localhost, so the connector just fails to connect and the rest
    # of the stack is unaffected.
    - V2X_VEHICLE_ID=${V2X_VEHICLE_ID:-d1}
    - V2X_VEHICLE_IDS=${V2X_VEHICLE_IDS:-d1,d2,d3,d4}
    - V2X_BROKER_HOST=${V2X_BROKER_HOST:-127.0.0.1}
    - V2X_BROKER_PORT=${V2X_BROKER_PORT:-1883}
    - V2X_MQTT_TLS_CA_FILE=${V2X_MQTT_TLS_CA_FILE:-}
    - V2X_MQTT_TLS_CERT_FILE=${V2X_MQTT_TLS_CERT_FILE:-}
    - V2X_MQTT_TLS_KEY_FILE=${V2X_MQTT_TLS_KEY_FILE:-}
  volumes:
    # Mount the repository so source/param edits take effect without rebuilding the
    # image: the image is built with --symlink-install, so install/**/*.param.yaml and
    # launch files are symlinks into /workspace/src. Build artifacts land in the host
    # repository's build/install, same as autoware-build does under /aichallenge.
    - ${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}:/workspace
    - ./output:${OUTPUT_ROOT:-/output}
    - ./vehicle:/vehicle:ro
    - ./aichallenge/utils:/aichallenge/utils:ro
    - ${V2X_TLS_DIR:-/etc/v2x/tls}:/etc/v2x/tls:ro
    - /dev/vcu:/dev/vcu
    - /dev/gnss:/dev/gnss
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  devices:
    - /dev/dri
  group_add:
    - "${HOST_GID_DIALOUT:-20}"
  working_dir: /workspace

# Build-only variant of the above. Drops the vehicle hardware (/dev/vcu, /dev/gnss),
# X11 and privileged mode so `make driver-build` also runs on a development PC.
x-racing_kart_interface-build-base: &racing_kart_interface-build-base
  <<: *racing_kart_interface-base
  privileged: false
  volumes:
    - ${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}:/workspace
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  devices: []

services:
  # Autoware service
  autoware:
    <<: *autoware-base
    command: ["bash", "-lc", "exec /aichallenge/run_autoware.bash ${RUN_MODE:-awsim} ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

  # Autoware service
  autoware-build:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/build_autoware.bash ${HOST_UID:-} ${HOST_GID:-}"]

  simulator:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/run_simulator.bash"]

  autoware-command:
    <<: *autoware-base
    command: ["bash", "-lc", "cd ${CMD_WORKDIR:-/aichallenge} && exec bash -lc \"${CMD:-}\""]

  rosbag:
    <<: *autoware-rosbag-base
    command: ["bash", "-lc", 'exec /aichallenge/utils/record_all_rosbag.bash "${ROS_DOMAIN_ID:-1}" "${LOG_DIR:-}"']

  autoware-simulator-evaluation:
    <<: *autoware-base
    image: "aichallenge-2025-eval"
    # /aichallenge is baked into the eval image; intentionally not mounted here.
    volumes:
      - ./output:${OUTPUT_ROOT:-/output}
      - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    command: ["bash", "-lc", "exec /aichallenge/run_evaluation.bash"]

#### vehicle specific services can be added here ####
  # Zenoh service
  zenoh:
    <<: *autoware-base
    working_dir: /vehicle
    command: ["bash", "-lc", "exec /vehicle/run_zenoh.bash ${VEHICLE_ID:-} ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

  # racing_kart_interface build service. Mirrors autoware-build: build in the
  # container, artifacts stay in the host repository.
  driver-build:
    <<: *racing_kart_interface-build-base
    # Root for the same reason autoware-build is; ownership is handed back below.
    user: "root"
    entrypoint: []
    command:
      - "bash"
      - "-lc"
      - >-
        source /opt/ros/humble/setup.bash &&
        cd /workspace &&
        colcon build --symlink-install --packages-up-to racing_kart_launch
        --cmake-args -DCMAKE_BUILD_TYPE=Release &&
        chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} build install log

  # Driver service
  driver:
    <<: *racing_kart_interface-base
    # Start as root for CAN/DDS host setup; /vehicle/run_driver.bash
    # fixes log ownership back to HOST_UID:HOST_GID.
    user: "root"
    entrypoint: []
    command: ["bash", "-lc", 'exec /vehicle/run_driver.bash vehicle "${ROS_DOMAIN_ID:-1}" "${LOG_DIR:-}" ${DRIVER_LAUNCH_ARGS:-}']

#### remote visualization services ####
  rviz2:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/utils/run_rviz.bash remote"]
